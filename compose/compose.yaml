services:
  mysql-paciente:
    container_name: mysql_paciente_846
    image: mysql:8.4.6

    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ./.data/mysql/paciente-data8:/var/lib/mysql

  mysql-triagem:
    container_name: mysql_triagem_846
    image: mysql:8.4.6

    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - ./.data/mysql/triagem-data8:/var/lib/mysql
