spring.application.name=ms-triagem

# Porta aleatória para execução em múltiplas instâncias
server.port=0
eureka.instance.instance-id=${spring.application.name}:${random.value}

# Eureka Client
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# MySQL (banco independente na porta 3307)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3307/db_saudeperto_triagem?createDatabaseIfNotExist=true&useTimezone=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.database.platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Resilience4j Circuit Breaker
resilience4j.circuitbreaker.instances.atualizarStatusPaciente.slidingWindowSize=3
resilience4j.circuitbreaker.instances.atualizarStatusPaciente.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.atualizarStatusPaciente.minimumNumberOfCalls=2
resilience4j.circuitbreaker.instances.atualizarStatusPaciente.failureRateThreshold=50
resilience4j.circuitbreaker.instances.atualizarStatusPaciente.waitDurationInOpenState=50s
